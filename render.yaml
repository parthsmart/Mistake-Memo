services:
  - type: web
    name: mistakememo-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_ASSIST_MODEL
        value: gemini-3.6-flash
